<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>
        <h1 class="title">智慧课堂</h1>
        <p class="subtitle">在线视频会议系统</p>
      </mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline">
          <mat-label>用户名</mat-label>
          <input matInput
                 formControlName="username"
                 placeholder="请输入用户名"
                 autocomplete="username">
          <mat-icon matSuffix>person</mat-icon>
          <mat-error *ngIf="loginForm.get('username')?.hasError('required')">
            用户名不能为空
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>密码</mat-label>
          <input matInput
                 [type]="hidePassword ? 'password' : 'text'"
                 formControlName="password"
                 placeholder="请输入密码"
                 autocomplete="current-password">
          <button mat-icon-button matSuffix
                  type="button"
                  (click)="hidePassword = !hidePassword">
            <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
            密码不能为空
          </mat-error>
          <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')">
            密码至少6位
          </mat-error>
        </mat-form-field>

        <button mat-raised-button
                color="primary"
                type="submit"
                class="login-button"
                [disabled]="loginForm.invalid || isLoading">
          <mat-spinner *ngIf="isLoading" diameter="20"></mat-spinner>
          <span *ngIf="!isLoading">登录</span>
          <span *ngIf="isLoading">登录中...</span>
        </button>
      </form>

      <div class="demo-accounts">
        <p class="demo-title">演示账号</p>
        <div class="demo-buttons">
          <button mat-stroked-button (click)="fillDemoAccount('admin')">
            管理员
          </button>
          <button mat-stroked-button (click)="fillDemoAccount('teacher')">
            教师
          </button>
          <button mat-stroked-button (click)="fillDemoAccount('student')">
            学生
          </button>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
